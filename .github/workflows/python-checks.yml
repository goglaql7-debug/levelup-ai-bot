name: Python and Cloudflare Worker checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile bot.py core.py
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

  cloudflare-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker syntax
        run: node --check cloudflare/worker.js
      - name: Run Worker unit tests
        run: node --test cloudflare/worker.test.js
